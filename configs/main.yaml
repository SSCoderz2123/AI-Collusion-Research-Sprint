# Main experiment. Values here are the pre-registered design (docs/PREREGISTRATION.md).
# Do not change phase1.select_* after phase 1 has run.
name: succession_main
seed: 20261023
history_window: 30
prompt_variant: default
price_min: 0.0
price_max: 10.0
checkpoint_every: 10

incumbent_model:
  name: qwen7b
  hf_id: Qwen/Qwen2.5-7B-Instruct
  max_model_len: 4096
  gpu_memory_utilization: 0.90
  dtype: auto

other_model:
  name: mistral7b
  hf_id: mistralai/Mistral-7B-Instruct-v0.3   # gated: accept the licence on Hugging Face first
  max_model_len: 4096
  gpu_memory_utilization: 0.90
  dtype: auto

sampling:
  temperature: 0.7
  top_p: 1.0
  max_tokens: 160

phase1:
  n_sessions: 20
  rounds: 100
  select_from: 50
  select_threshold: 0.3

phase2:
  rounds: 100
  swap_seat: 1
  announce: true
  branches: [control, placebo, same_inherit, same_blank, other_inherit, other_blank, br_bot]

deviation:
  enabled: true
  cut: 0.10
  horizon: 6
  discount: 0.95
  deviator_seats: [0, 1]
