# Smoke test (Qwen2.5-14B on L40S): loads the model as incumbent, checks the A/A stage and the reply
# parse rate in a short phase 1. Not part of the analysis. Stages: aa,phase1,select,analyze.
name: smoke_qwen14b
seed: 1
history_window: 30
prompt_variant: default
price_min: 0.0
price_max: 10.0
checkpoint_every: 10
dedupe_requests: true

incumbent_model:
  name: qwen14b
  hf_id: Qwen/Qwen2.5-14B-Instruct
  max_model_len: 4096
  gpu_memory_utilization: 0.90
  dtype: auto
  gpu: L40S

other_model:
  name: granite8b
  hf_id: ibm-granite/granite-3.1-8b-instruct   # ungated, Apache 2.0
  max_model_len: 4096
  gpu_memory_utilization: 0.90
  dtype: auto

sampling:
  temperature: 0.7
  top_p: 1.0
  max_tokens: 160

phase1:
  n_sessions: 2
  rounds: 10
  select_from: 5
  select_threshold: 0.3

phase2:
  rounds: 100
  swap_seat: 1
  announce: true
  branches: [control, placebo, same_inherit, same_blank, same_notes, other_inherit, other_blank, br_bot]

controls:
  n_per_variant: 30   # runs 4-8: 10; the trigger and myopic CIs were too wide
  rounds: 60

deviation:
  enabled: true
  cut: 0.10
  horizon: 6
  discount: 0.95
  deviator_seats: [0, 1]
