[project]
name = "succession"
version = "0.1.0"
description = "Cartel succession: does LLM price collusion survive replacing an agent?"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0", "matplotlib>=3.8"]

[project.optional-dependencies]
modal = ["modal>=1.0"]
gpu = ["vllm==0.8.5"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is kept on one line per bullet, exactly as the model sees it.
"succession/prompts.py" = ["E501"]
